# ============================================================
# pytest.ini
# Settings pytest reads every time it runs, so the output stays
# short enough to read.
#
#   -v                   list every test by name with PASSED or FAILED
#   --tb=line            show each failure as one line: file, line, error
#   --show-capture=no    hide what the code printed while the test ran
#   -rxX                 at the end, list every expected failure (XFAIL)
#                        and every test still marked as one that now
#                        passes (XPASS), with their reasons
#
# For the full detail on one test, override these on the command
# line, for example: pytest --tb=long -k test_name
# ============================================================
[pytest]
testpaths = tests
addopts = -v --tb=line --show-capture=no -rxX
